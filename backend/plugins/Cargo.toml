[package]
name = "nur_plugins"
description = "Wasmtime plugin runtime for nur-cms"
readme.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
colored = "3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
nur_core = { path = "../core" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio", "postgres", "migrate"
] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
toml_edit = { version = "0.25", features = ["serde"] }
tracing = "0.1"
wasmtime = { version = "48", default-features = false, features = [
    "cache", "component-model", "cranelift", "runtime", "std"
] }
wasmtime-wasi = { version = "48", default-features = false, features = ["p2"] }
sqlparser = { version = "0.62.0", default-features = false, features = [
    "recursive-protection", "std", "visitor"
] }
