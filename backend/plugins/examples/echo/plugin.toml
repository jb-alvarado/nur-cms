[plugin]
id = "echo"
name = "Echo"
version = "0.1.0"
api_version = 1
cms_version = ">=0.19"
module = "target/wasm32-wasip2/release/nur_cms_echo_plugin.wasm"

[migrations]
directory = "migrations"

[mail]
targets = ["contact"]
dynamic_recipient_targets = ["contact"]

[assets]
directory = "assets"

[[storage.directories]]
id = "submissions"
path = "submissions/{year}/{month}"
extensions = ["pdf", "txt"]
visibility = "public"
upload = "link"
access = "admin,author"

# Optional server-side cache for this plugin's public GET and HEAD routes.
# Individual routes can opt out with `cache = false`.
[cache]
ttl_seconds = 60
max_entries = 64

[[routes]]
id = "echo"
method = "POST"
path = "/"
access = "public"

[[routes]]
id = "author"
method = "GET"
path = "/author"
access = "author"

[[routes]]
id = "editor"
method = "GET"
path = "/editor"
access = "admin,author"

[[routes]]
id = "root"
method = "GET"
path = "/plugin-echo"
scope = "root"
access = "public"

[[routes]]
id = "database"
method = "POST"
path = "/database"
access = "admin,author"

[[routes]]
id = "rollback"
method = "POST"
path = "/rollback"
access = "admin,author"

[[routes]]
id = "mail"
method = "POST"
path = "/mail"
access = "public"

[[routes]]
id = "upload-link"
method = "POST"
path = "/upload-link"
access = "admin,author"

[admin]
entry = "admin.js"
element = "nur-cms-echo"
access = "admin,author"
styles = ["admin.css"]

[[admin.menu]]
label = "Overview"
labels = { de = "Übersicht", en = "Overview" }
path = "/overview"
icon = "bi-puzzle"
access = "admin,author"

[[admin.menu]]
label = "Admin tools"
labels = { de = "Admin-Werkzeuge", en = "Admin tools" }
path = "/admin-tools"
icon = "bi-tools"
access = "admin"
