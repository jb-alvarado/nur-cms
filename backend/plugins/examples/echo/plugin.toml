[plugin]
id = "echo"
version = "0.1.0"
api_version = 1
cms_version = ">=0.16, <0.17"
module = "target/wasm32-wasip2/release/nur_cms_echo_plugin.wasm"

[migrations]
directory = "migrations"

# Optional server-side cache for this plugin's public GET and HEAD routes.
# Individual routes can opt out with `cache = false`.
[cache]
ttl_seconds = 60
max_entries = 64

[[routes]]
id = "echo"
method = "POST"
path = "/api/plugins/echo"
access = "public"

[[routes]]
id = "author"
method = "GET"
path = "/api/plugins/echo/author"
access = "author"

[[routes]]
id = "editor"
method = "GET"
path = "/api/plugins/echo/editor"
access = "admin,author"

[[routes]]
id = "root"
method = "GET"
path = "/plugin-echo"
access = "public"

[admin]

[[admin.menu]]
label = "Echo plugin"
path = "/admin/plugins/echo"
icon = "bi-puzzle"
